<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- 1. Meta viewport obligatorio para móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Legends - Responsive Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #e94560; --secondary: #0f3460; --accent: #f1c40f; --bg: #1a1a2e;
    }
    .tema-hielo { --primary: #00d2ff; --secondary: #003366; --accent: #ade8f4; --bg: #03045e; }

    /* Estructura Fluida */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg); color: #fff;
      display: flex; flex-direction: column; align-items: center; 
      padding: 10px; 
      min-height: 100vh; /* 3. Altura mínima adaptable */
      transition: background 0.5s ease;
      overflow-x: hidden;
    }

    /* 2. Contenedores con ancho máximo y porcentajes */
    .container {
      width: 100%;
      max-width: 1200px; /* 7. Límite profesional para PC */
      margin: auto;
      padding: 15px;
    }

    #overlay-inicio {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 52, 96, 0.98); z-index: 3000;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }

    .menu-inicio-card {
      background: var(--secondary); 
      padding: 2rem; 
      border-radius: 25px;
      border: 3px solid var(--primary); 
      text-align: center; 
      width: 100%;
      max-width: 500px; /* Se adapta a móvil pero no crece de más en PC */
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* 6. Imágenes Responsive */
    .logo-inicio {
      max-width: 100%; 
      height: auto; 
      max-height: 200px;
      object-fit: contain; 
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 8px var(--accent));
    }

    .audio-container {
      position: relative; /* Cambiado de absolute para mejor flujo en móvil */
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px; border-radius: 50px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }

    #app {
      background: var(--secondary); border-radius: 30px; 
      padding: 1.5rem;
      width: 100%;
      max-width: 1100px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: none; flex-direction: column; align-items: center;
    }

    /* 4. Flexbox Responsive para Stats */
    #stats { 
      display: flex; 
      flex-wrap: wrap; /* Permite que bajen en pantallas chicas */
      justify-content: center; 
      gap: 10px; 
      margin: 1rem 0; 
      width: 100%; 
    }
    
    .stat-box {
      border: 2px solid var(--primary); border-radius: 12px; 
      padding: 10px;
      flex: 1 1 100px; /* Crece y se adapta */
      text-align: center; background: rgba(0,0,0,0.2);
    }

    /* 5 & 10. Grid Adaptable (Mobile First) */
    #tablero { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); /* 2 columnas en móvil */
      gap: 10px; 
      width: 100%; 
      max-width: 900px;
      margin-top: 1rem;
    }

    /* Media Query para Tablets y PC */
    @media(min-width: 600px) {
      #tablero { grid-template-columns: repeat(4, 1fr); gap: 15px; }
      .header-main h1 { font-size: 2.5rem; }
    }

    .carta { aspect-ratio: 1; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
    .carta.flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; border: 2px solid var(--accent); overflow: hidden; }
    .face img { width: 100%; height: 100%; object-fit: contain; }
    .front { transform: rotateY(180deg); background: rgba(255,255,255,0.05); }
    .back { background: var(--secondary); }

    /* Botones Adaptables */
    .controles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
    .btn { 
      padding: 0.8rem 1.2rem; border-radius: 50px; border: none; cursor: pointer; 
      font-weight: 800; text-transform: uppercase; transition: 0.3s;
      font-size: 0.9rem;
    }
    .btn-explorar { background: var(--primary); color: white; }
    .btn-gris { background: rgba(255,255,255,0.1); color: #fff; }

    /* Animaciones de puntos */
    .points-float {
      position: absolute; top: 50%; left: 50%; color: var(--accent);
      font-weight: 900; font-size: 1.8rem; text-shadow: 2px 2px 5px #000;
      animation: float-up 1.2s ease-out forwards; z-index: 100;
    }

    @keyframes float-up {
      0% { opacity: 1; transform: translate(-50%, -50%) rotateY(180deg); }
      100% { opacity: 0; transform: translate(-50%, -150%) rotateY(180deg); }
    }

    #modal-victoria {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 4000; justify-content: center; align-items: center; 
      text-align: center; padding: 20px;
    }

    .ocultar { display: none !important; }
  </style>
</head>
<body>

  <div id="overlay-inicio">
    <div class="menu-inicio-card">
      <img src="https://lh3.googleusercontent.com/d/16kPOn6omfFbjglvpe-9Bv_DAiLq0VONy" class="logo-inicio" alt="Logo">
      <h1 style="color: var(--accent); font-size: 1.5rem;">ANIMAL LEGENDS</h1>
      <div style="text-align:left; background:rgba(0,0,0,0.3); padding:15px; border-radius:15px; margin: 1rem 0; font-size: 0.9rem;">
        <p style="color:var(--primary); font-weight:bold;">REGLAS:</p>
        <p>• Encuentra los 8 pares.</p>
        <p>• Leyendas valen 1500P.</p>
      </div>
      <select id="mundo-select-inicio" style="width:100%; padding:10px; margin-bottom:1rem; background:var(--bg); color:#fff; border:2px solid var(--accent); border-radius:10px;">
        <option value="hibrido">MUNDO HÍBRIDO</option>
        <option value="hielo">MUNDO DE HIELO</option>
      </select>
      <button class="btn btn-explorar" style="width:100%;" onclick="comenzarJuego()">INICIAR JUEGO</button>
    </div>
  </div>

  <div id="app" class="container">
    <div class="audio-container">
      <button onclick="toggleMusic()" style="background:none; border:none; color:white; cursor:pointer;">
        <i class="fa-solid fa-play" id="music-icon"></i>
      </button>
      <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.5" style="width: 60px;">
    </div>

    <div class="header-main">
      <h1 id="titulo-mundo" style="font-size: 1.8rem;">ANIMAL LEGENDS</h1>
    </div>

    <div id="stats">
      <div class="stat-box"><span id="val-tiempo">00:00</span><br><small>Tiempo</small></div>
      <div class="stat-box"><span id="val-pares">0/8</span><br><small>Pares</small></div>
      <div class="stat-box" style="border-color:var(--accent);"><span id="val-puntos">0</span><br><small>Puntos</small></div>
    </div>

    <div class="controles">
      <button class="btn btn-gris" onclick="mezclarMazo()">REINICIAR</button>
      <button class="btn btn-gris" onclick="volverAlMenu()">MENÚ</button>
    </div>

    <div id="tablero"></div>
  </div>

  <div id="modal-victoria">
    <div class="menu-inicio-card">
      <h2 id="msg-felicitacion" style="color:var(--accent);"></h2>
      <p id="stats-finales" style="margin: 1.5rem 0;"></p>
      <button class="btn btn-explorar" onclick="cerrarModalYReiniciar()" style="width:100%; margin-bottom:10px;">REPETIR</button>
      <button class="btn btn-gris" onclick="volverAlMenu()" style="width:100%;">MUNDOS</button>
    </div>
  </div>

  <audio id="game-audio" loop src="https://stream.zeno.fm/0r0xa792kwzuv"></audio>

  <script>
    const audio = document.getElementById('game-audio');
    const musicIcon = document.getElementById('music-icon');
    const DORSO_HIBRIDO = '1ewu_QyVQel-EWA5DHW93RYR6G9vJ2d6_';
    const DORSO_HIELO = '18y--weyWyTsT_SdAbMHcZuUJNBuWAWuI';
    
    let mazo = [], leyendas = [], primera = null, segunda = null, bloqueado = false;
    let paresEnc = 0, puntos = 0, tiempo = 0, cronoIdx;

    const MUNDOS = {
      hibrido: { 
        dorso: DORSO_HIBRIDO,
        imagenes: { 
          'a': '1lSewG0HFoXu7pkuZnSfk3eYGXZpJyArl', 'b': '18r503w24-xeY7ls8DjLW-H72OgRsiKIw', 
          'c': '1GuBzYluK2OUufoM7Zal4VrqfTDL4Pg-A', 'd': '1VK_ZmemKE_ZFAxnhMvL9LBMtadzpSv-A', 
          'e': '1OpGi0QGcZFPM6UIVV3ko9TQ8RuN0YNsB', 'f': '1u5Z2_06-8xEze1LVAEHPCc8QFiquNxXQ', 
          'g': '17v_NxLVaJwEy9fnn3V2Y572BNn1UmpC_', 'h': '1LpsdXZ-jCMHXXSNYeNprG3NxLQtTZAiu' 
        } 
      },
      hielo: { 
        dorso: DORSO_HIELO,
        imagenes: { '1': '1R8ABQMznCdExQs8D50_-BzNEngU1C-KN', '2': '1unb5405SydYtd0biiV5UnJ532psHoEjX', '3': '1qJan5z_aQxgAEKV5iJ380AS1L98plnvs', '4': '1uoMw2qE_sJKACPrG3weU24Joa0YLs3hN', '5': '1NlBGIN6qDJFmN1Jo9JFrEIlFVJHHa8dH', '6': '1DIRrECXC7-X4IFt27Ko9cmzGD-UcZecF', '7': '1wGg2nRf_UvX3PUQFNJxb0N7aEAOObJnD', '8': '1yRUqU4UXtUkhj4xIZwYz7T9T_Qny5o6G' } 
      }
    };

    function toggleMusic() {
      if (audio.paused) { audio.play(); musicIcon.className = "fa-solid fa-pause"; }
      else { audio.pause(); musicIcon.className = "fa-solid fa-play"; }
    }

    function comenzarJuego() {
      document.getElementById('overlay-inicio').classList.add('ocultar');
      document.getElementById('app').style.display = 'flex';
      mezclarMazo();
      iniciarCrono();
    }

    function mezclarMazo() {
      puntos = 0; paresEnc = 0; tiempo = 0;
      document.getElementById('val-puntos').innerText = 0;
      document.getElementById('val-pares').innerText = "0/8";
      const mKey = document.getElementById('mundo-select-inicio').value;
      const config = MUNDOS[mKey];
      const keys = Object.keys(config.imagenes);
      leyendas = [...keys].sort(() => 0.5 - Math.random()).slice(0, 2);
      mazo = [...keys, ...keys].sort(() => 0.5 - Math.random());
      const t = document.getElementById('tablero');
      t.innerHTML = '';
      mazo.forEach(id => {
        const c = document.createElement('div'); c.className = 'carta'; c.dataset.id = id;
        c.innerHTML = `<div class="face back"><img src="https://lh3.googleusercontent.com/d/${config.dorso}"></div>
                       <div class="face front"><img src="https://lh3.googleusercontent.com/d/${config.imagenes[id]}"></div>`;
        c.onclick = () => voltear(c);
        t.appendChild(c);
      });
    }

    function voltear(c) {
      if(bloqueado || c === primera || c.classList.contains('flipped')) return;
      c.classList.add('flipped');
      if(!primera) return primera = c;
      segunda = c; bloqueado = true;
      if(primera.dataset.id === segunda.dataset.id) {
        paresEnc++;
        const valor = leyendas.includes(primera.dataset.id) ? 1500 : 500;
        puntos += valor;
        const float = document.createElement('div');
        float.className = 'points-float'; float.innerText = valor + "P";
        segunda.appendChild(float);
        document.getElementById('val-pares').innerText = `${paresEnc}/8`;
        document.getElementById('val-puntos').innerText = puntos;
        primera = segunda = null; bloqueado = false;
        if(paresEnc === 8) finalizarJuego();
      } else {
        setTimeout(() => { primera.classList.remove('flipped'); segunda.classList.remove('flipped'); primera = segunda = null; bloqueado = false; }, 700);
      }
    }

    function iniciarCrono() {
      clearInterval(cronoIdx);
      cronoIdx = setInterval(() => {
        tiempo++;
        let m = Math.floor(tiempo / 60).toString().padStart(2, '0');
        let s = (tiempo % 60).toString().padStart(2, '0');
        document.getElementById('val-tiempo').innerText = `${m}:${s}`;
      }, 1000);
    }

    function finalizarJuego() {
      clearInterval(cronoIdx);
      document.getElementById('modal-victoria').style.display = 'flex';
      document.getElementById('msg-felicitacion').innerText = tiempo < 60 ? "¡RÉCORD!" : "¡GANASTE!";
      document.getElementById('stats-finales').innerText = `Tiempo: ${tiempo}s\nPuntos: ${puntos}P`;
    }

    function volverAlMenu() { location.reload(); }
    function cerrarModalYReiniciar() { document.getElementById('modal-victoria').style.display = 'none'; mezclarMazo(); iniciarCrono(); }
  </script>
</body>
</html>
