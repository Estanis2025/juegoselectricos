<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Meta viewport para control de escala en móviles -->
  <title>Animal Legends - Scroll Horizontal Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #e94560; --secondary: #0f3460; --accent: #f1c40f; --bg: #1a1a2e;
    }
    .tema-hielo { --primary: #00d2ff; --secondary: #003366; --accent: #ade8f4; --bg: #03045e; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg); color: #fff;
      display: flex; flex-direction: column; align-items: center; 
      padding: 10px; 
      min-height: 100vh; /* Altura mínima adaptable */
      transition: background 0.5s ease;
    }

    /* --- CONTENEDOR DE LA APP --- */
    #app {
      background: var(--secondary); border-radius: 30px; 
      padding: 1.5rem;
      width: 95%; /* Ancho porcentual para responsividad */
      max-width: 1100px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: none; flex-direction: column; align-items: center;
    }

    /* --- ÁREA DE DESPLAZAMIENTO HORIZONTAL --- */
    /* Este contenedor permite que el tablero sea más ancho que la pantalla en celulares */
    .tablero-wrapper {
      width: 100%;
      overflow-x: auto; /* Habilita la barra de desplazamiento horizontal */
      padding: 10px 0;
      -webkit-overflow-scrolling: touch; /* Suavidad de scroll en iOS */
    }

    /* Personalización de la barra de scroll */
    .tablero-wrapper::-webkit-scrollbar {
      height: 8px;
    }
    .tablero-wrapper::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    #tablero { 
      display: grid; 
      /* Definimos un ancho mínimo para forzar el scroll en pantallas pequeñas */
      grid-template-columns: repeat(4, minmax(140px, 1fr)); 
      gap: 15px; 
      min-width: 600px; /* Asegura que las cartas mantengan un tamaño visible */
      margin: 0 auto;
    }

    /* --- CARTAS --- */
    .carta { aspect-ratio: 1; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
    .carta.flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; border: 2px solid var(--accent); overflow: hidden; }
    .face img { width: 100%; height: 100%; object-fit: contain; } /* Imágenes fluidas */
    .front { transform: rotateY(180deg); background: rgba(255,255,255,0.05); }
    .back { background: var(--secondary); }

    /* --- RESTO DE ELEMENTOS (STATS, BOTONES, ETC) --- */
    #stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 1rem 0; width: 100%; }
    .stat-box { border: 2px solid var(--primary); border-radius: 12px; padding: 10px; flex: 1 1 100px; text-align: center; }
    .btn { padding: 0.8rem 1.2rem; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; transition: 0.3s; }
    .btn-explorar { background: var(--primary); color: white; }
    .btn-gris { background: rgba(255,255,255,0.1); color: #fff; }

    #overlay-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 52, 96, 0.98); z-index: 3000; display: flex; justify-content: center; align-items: center; }
    .menu-inicio-card { background: var(--secondary); padding: 2rem; border-radius: 25px; border: 3px solid var(--primary); text-align: center; width: 90%; max-width: 500px; }
    
    .points-float { position: absolute; top: 50%; left: 50%; color: var(--accent); font-weight: 900; font-size: 1.8rem; animation: float-up 1.2s ease-out forwards; }
    @keyframes float-up { 0% { opacity: 1; transform: translate(-50%, -50%) rotateY(180deg); } 100% { opacity: 0; transform: translate(-50%, -150%) rotateY(180deg); } }

    .ocultar { display: none !important; }
  </style>
</head>
<body>

  <div id="overlay-inicio">
    <div class="menu-inicio-card">
      <img src="https://lh3.googleusercontent.com/d/16kPOn6omfFbjglvpe-9Bv_DAiLq0VONy" style="max-width:100%; height:auto; max-height:200px;" alt="Logo">
      <h1 style="color: var(--accent); margin: 10px 0;">ANIMAL LEGENDS</h1>
      <select id="mundo-select-inicio" style="width:100%; padding:10px; margin-bottom:1rem; background:var(--bg); color:#fff; border:2px solid var(--accent); border-radius:10px;">
        <option value="hibrido">MUNDO HÍBRIDO</option>
        <option value="hielo">MUNDO DE HIELO</option>
      </select>
      <button class="btn btn-explorar" style="width:100%;" onclick="comenzarJuego()">INICIAR JUEGO</button>
    </div>
  </div>

  <div id="app">
    <div class="header-main">
      <h1 id="titulo-mundo" style="font-size: 1.8rem; text-align: center;">ANIMAL LEGENDS</h1>
    </div>

    <div id="stats">
      <div class="stat-box"><span id="val-tiempo">00:00</span><br><small>Tiempo</small></div>
      <div class="stat-box"><span id="val-pares">0/8</span><br><small>Pares</small></div>
      <div class="stat-box" style="border-color:var(--accent);"><span id="val-puntos">0</span><br><small>Puntos</small></div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:1rem;">
      <button class="btn btn-gris" onclick="mezclarMazo()">REINICIAR</button>
      <button class="btn btn-gris" onclick="volverAlMenu()">MENÚ</button>
    </div>

    <!-- CONTENEDOR CON SCROLL HORIZONTAL -->
    <div class="tablero-wrapper">
      <div id="tablero"></div>
    </div>
  </div>

  <audio id="game-audio" loop src="https://stream.zeno.fm/0r0xa792kwzuv"></audio>

  <script>
    const DORSO_HIBRIDO = '1ewu_QyVQel-EWA5DHW93RYR6G9vJ2d6_';
    const DORSO_HIELO = '18y--weyWyTsT_SdAbMHcZuUJNBuWAWuI';
    let mazo = [], leyendas = [], primera = null, segunda = null, bloqueado = false;
    let paresEnc = 0, puntos = 0, tiempo = 0, cronoIdx;

    const MUNDOS = {
      hibrido: { dorso: DORSO_HIBRIDO, imagenes: { 'a': '1lSewG0HFoXu7pkuZnSfk3eYGXZpJyArl', 'b': '18r503w24-xeY7ls8DjLW-H72OgRsiKIw', 'c': '1GuBzYluK2OUufoM7Zal4VrqfTDL4Pg-A', 'd': '1VK_ZmemKE_ZFAxnhMvL9LBMtadzpSv-A', 'e': '1OpGi0QGcZFPM6UIVV3ko9TQ8RuN0YNsB', 'f': '1u5Z2_06-8xEze1LVAEHPCc8QFiquNxXQ', 'g': '17v_NxLVaJwEy9fnn3V2Y572BNn1UmpC_', 'h': '1LpsdXZ-jCMHXXSNYeNprG3NxLQtTZAiu' } },
      hielo: { dorso: DORSO_HIELO, imagenes: { '1': '1R8ABQMznCdExQs8D50_-BzNEngU1C-KN', '2': '1unb5405SydYtd0biiV5UnJ532psHoEjX', '3': '1qJan5z_aQxgAEKV5iJ380AS1L98plnvs', '4': '1uoMw2qE_sJKACPrG3weU24Joa0YLs3hN', '5': '1NlBGIN6qDJFmN1Jo9JFrEIlFVJHHa8dH', '6': '1DIRrECXC7-X4IFt27Ko9cmzGD-UcZecF', '7': '1wGg2nRf_UvX3PUQFNJxb0N7aEAOObJnD', '8': '1yRUqU4UXtUkhj4xIZwYz7T9T_Qny5o6G' } }
    };

    function comenzarJuego() {
      document.getElementById('overlay-inicio').classList.add('ocultar');
      document.getElementById('app').style.display = 'flex';
      mezclarMazo();
      iniciarCrono();
    }

    function mezclarMazo() {
      puntos = 0; paresEnc = 0; tiempo = 0;
      const mKey = document.getElementById('mundo-select-inicio').value;
      const config = MUNDOS[mKey];
      const keys = Object.keys(config.imagenes);
      leyendas = [...keys].sort(() => 0.5 - Math.random()).slice(0, 2);
      mazo = [...keys, ...keys].sort(() => 0.5 - Math.random());
      const t = document.getElementById('tablero');
      t.innerHTML = '';
      mazo.forEach(id => {
        const c = document.createElement('div'); c.className = 'carta'; c.dataset.id = id;
        c.innerHTML = `<div class="face back"><img src="https://lh3.googleusercontent.com/d/${config.dorso}"></div>
                       <div class="face front"><img src="https://lh3.googleusercontent.com/d/${config.imagenes[id]}"></div>`;
        c.onclick = () => voltear(c);
        t.appendChild(c);
      });
    }

    function voltear(c) {
      if(bloqueado || c === primera || c.classList.contains('flipped')) return;
      c.classList.add('flipped');
      if(!primera) return primera = c;
      segunda = c; bloqueado = true;
      if(primera.dataset.id === segunda.dataset.id) {
        paresEnc++;
        const valor = leyendas.includes(primera.dataset.id) ? 1500 : 500;
        puntos += valor;
        const float = document.createElement('div');
        float.className = 'points-float'; float.innerText = valor + "P";
        segunda.appendChild(float);
        document.getElementById('val-puntos').innerText = puntos;
        document.getElementById('val-pares').innerText = `${paresEnc}/8`;
        primera = segunda = null; bloqueado = false;
      } else {
        setTimeout(() => { primera.classList.remove('flipped'); segunda.classList.remove('flipped'); primera = segunda = null; bloqueado = false; }, 700);
      }
    }

    function iniciarCrono() {
      clearInterval(cronoIdx);
      cronoIdx = setInterval(() => {
        tiempo++;
        let m = Math.floor(tiempo / 60).toString().padStart(2, '0');
        let s = (tiempo % 60).toString().padStart(2, '0');
        document.getElementById('val-tiempo').innerText = `${m}:${s}`;
      }, 1000);
    }

    function volverAlMenu() { location.reload(); }
  </script>
</body>
</html>
